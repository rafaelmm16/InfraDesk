name: CI — Build & Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install & Test Backend API
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test

      - name: Install & Test Endpoint Agent
        working-directory: agent
        run: |
          npm ci
          npm run build
          npm test

      - name: Install, Typecheck & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
